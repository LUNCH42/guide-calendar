<style>

"세화종합사회복지관","신청인원":"14","배치인원":"1","신청자 정보":"민태희님\n(010-7679-3034)","선별장":"X","이용목적":"환경 관련 프로그램 이용자 견학","담당 해설사":"조기숙","date":"2026-09-23"},{"sheet":"9월 배치","구분":"9","일시":"2026-09-23 (수)","시간":"14:30","단체명":"송도고등학교","신청인원":"25","배치인원":"2","신청자 정보":"문화영님\n(010-9336-0550)","선별장":"X","이용목적":"자원순환 학급 프로젝트 일환으로 소각관련 교육신청합니다. (2시반~3시 사이 도착예정)","담당 해설사":"김금형, 신인순","date":"2026-09-23"},{"sheet":"9월 배치","구분":"10","일시":"2026-09-28 (월)","시간":"10:20","단체명":"청송유치원","신청인원":"16","배치인원":"1","신청자 정보":"오현아님\n(010-8557-4080)","선별장":"X","이용목적":"유아 견학 (인솔자 1명) /\n10시 20~30분쯤 도착예정","담당 해설사":"정군미","date":"2026-09-28"},{"sheet":"10월 배치","구분":"1","일시":"2026-10-19 (월)","시간":"15:30","단체명":"베트남 떠이닌성 공무원 견학","신청인원":"27","배치인원":"2","신청자 정보":"김현수님\n(010-8897-7724)","선별장":"X","이용목적":"베트남 공무원 연수과정 운영\n공무원 23명 / 통역 2명 / 운영조교 2명\n베트남어 순차 통역 진행","담당 해설사":"김금형, 신인순, 조기숙","date":"2026-10-19"},{"sheet":"10월 배치","구분":"2","일시":"2026-10-23 (금)","시간":"10:30","단체명":"카이트엔지니어링","신청인원":"8","배치인원":"1","신청자 정보":"김종수님\n(010-5000-5451)","선별장":"O","이용목적":"가나 정부 환경부서 담당자/관계자 소각장 및 자원 회수시설 견학\n선별장 먼저 방문(10시) 후 소각장 견학\n(소각장 도착시 10시 반 정도 예상)","담당 해설사":"정혜란","date":"2026-10-23"},{"sheet":"10월 배치","구분":"3","일시":"2026-10-27 (화)","시간":"14:00","단체명":"인하대학교","신청인원":"20","배치인원":"2","신청자 정보":"임병기님\n(010-5251-6996)","선별장":"X","이용목적":"에너지공유대학사업(ETL) 참여 석·박사과정 대상 현장견학을 추진합니다. 인하대, 인천대 공동참여 예정입니다.","담당 해설사":"김영선, 김선례","date":"2026-10-27"}];
let cur=new Date(2026,9,1);
const fields=["시간","단체명","신청인원","배치인원","담당 해설사","선별장","이용목적","인솔선생님","신청자 정보"];
function get(e,words){let k=Object.keys(e).find(k=>words.some(w=>k.includes(w)));return k?e[k]:""}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cancelled(e){return Object.values(e).join(" ").includes("취소")}
function dateKey(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function initFilter(){let names=new Set();DATA.forEach(e=>{let s=get(e,["담당 해설사"]);s.split(/[,/·]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>names.add(x))});let sel=document.getElementById("filter");[...names].sort().forEach(n=>{let o=document.createElement("option");o.value=n;o.textContent=n;sel.appendChild(o)})}
function visible(e){let f=document.getElementById("filter").value;return !f||get(e,["담당 해설사"]).includes(f)}
function render(){
 let y=cur.getFullYear(),m=cur.getMonth();document.getElementById("month").textContent=y+"년 "+(m+1)+"월";
 let first=new Date(y,m,1),last=new Date(y,m+1,0),start=first.getDay(),total=Math.ceil((start+last.getDate())/7)*7;
 let g=document.getElementById("grid");g.innerHTML="";
 for(let i=0;i<total;i++){let d=i-start+1,cell=document.createElement("div");cell.className="day";let dt=new Date(y,m,d);
 if(d<1||d>last.getDate()){cell.classList.add("muted");cell.innerHTML="<div class='num'>"+dt.getDate()+"</div>"}
 else{let ds=dateKey(y,m,d),events=DATA.filter(e=>e.date===ds&&visible(e));if(dt.toDateString()===new Date().toDateString())cell.classList.add("today");
 cell.innerHTML="<div class='num'>"+d+"</div>";events.slice(0,4).forEach(e=>{let x=document.createElement("div");x.className="event"+(cancelled(e)?" cancel":"");x.textContent=(get(e,["시간"])+" "+get(e,["단체명"])).trim();cell.appendChild(x)});if(events.length>4){let x=document.createElement("div");x.className="more";x.textContent="+ "+(events.length-4)+"건 더보기";cell.appendChild(x)}if(events.length)cell.onclick=()=>openModal(ds,events)}g.appendChild(cell)}
}
function openModal(ds,events){let [y,m,d]=ds.split("-").map(Number);document.getElementById("title").textContent=y+"년 "+m+"월 "+d+"일 견학 일정";let b=document.getElementById("body");b.innerHTML="";
events.forEach((e,i)=>{let c=document.createElement("div");c.className="card"+(cancelled(e)?" cancel":"");let name=get(e,["단체명"])||("견학 일정 "+(i+1));let rows="";
fields.forEach(f=>{let v=get(e,[f]);if(v)rows+="<div class='label'>"+f+"</div><div>"+esc(v)+"</div>"});
c.innerHTML="<h3>"+esc(name)+(cancelled(e)?" <span class='badge'>취소</span>":"")+"</h3><div class='info'>"+rows+"</div>";b.appendChild(c)});document.getElementById("overlay").style.display="flex"}
function closeModal(){document.getElementById("overlay").style.display="none"}
function move(n){cur.setMonth(cur.getMonth()+n);render()}function today(){let t=new Date();cur=new Date(t.getFullYear(),t.getMonth(),1);render()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});initFilter();render();
</script></body></html>
